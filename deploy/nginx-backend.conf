# nginx vhost for backend.l1beat.io, proxying to the Node app on 127.0.0.1:5001.
# Install: sudo cp deploy/nginx-backend.conf /etc/nginx/sites-available/backend
#          sudo ln -s /etc/nginx/sites-available/backend /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d backend.l1beat.io (adds the 443 listener).

server {
    server_name backend.l1beat.io;

    client_max_body_size 1m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    # Block dotfile scanners (.env, .git, etc.)
    location ~ /\. {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
}
